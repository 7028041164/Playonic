<!DOCTYPE html>
<html>
<head>
  <title>Typing Master Pro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- HOME -->
<div id="setup" class="screen">
  <div class="homeIcon" onclick="goHome()">
  <i class="fas fa-home"></i>
</div>
    <h1>⚡ Typing Master Pro</h1>

    <div class="controls">
  <select id="mode">
    <option value="word">🔤 Word Mode</option>
    <option value="sentence">📝 Sentence Mode</option>
    <option value="paragraph">📄 Paragraph Mode</option>
  </select>

  <select id="level">
    <option value="easy">🟢 Easy</option>
    <option value="medium">🟡 Medium</option>
    <option value="hard">🔴 Hard</option>
  </select>

  <select id="timeSelect">
   <option value="30">30 sec</option>
   <option value="60">1 min</option>
   <option value="120">2 min</option>
   <option value="300">5 min</option>
  <option value="600">10 min</option>
  <option value="900">15 min</option>
 <option value="1200">20 min</option>
  </select>
</div>

<button class="startBtn" onclick="startGame()">Start Game 🚀</button>
</div>

<!-- GAME -->
<div id="game" class="screen">

<div class="homeIcon" onclick="goHome()">
  <i class="fas fa-home"></i>
</div>

  <div class="stats">
    ⏱ <span id="time"></span>s |
    ⚡ WPM: <span id="wpm">0</span> |
    🎯 Accuracy: <span id="acc">100</span>%
  </div>

  <!-- 📊 Progress Bar -->
  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <p id="word"></p>
  <input id="input" placeholder="Type here..." />
</div>

<!-- RESULT -->
  <div id="result" class="screen">
  <div class="resultCard">
    <h2>🏆 Result</h2>

    <p>⚡ WPM: <span id="rwpm"></span></p>
    <p>🎯 Accuracy: <span id="racc"></span>%</p>
    <p>⏱ Time Used: <span id="rtime"></span>s</p>
    <p>🥇 Best WPM: <span id="bestWpm"></span></p>

    <h3 id="performance"></h3>

    <button class="startBtn" onclick="startGame()">Play Again 🚀</button>
   <button class="startBtn" onclick="goToSetup()">Back 🚀</button>
  </div>
</div>


 <div id="mainHome" class="screen active">
  
  <h1 class="gameTitle">⚡ Typing Master Pro</h1>
  
  <button class="mainBtn" onclick="goToSetup()">▶ Play</button>


  


<!-- Background Music -->
<audio id="bgMusic" loop>
  <source src="sound/bg.mp3" type="audio/mpeg">
</audio>
  </div>
    <audio id="typeSound" src="sound/type.mp3"></audio>
    <audio id="correctSound" src="sound/click.mp3"></audio>
    <audio id="wrongSound" src="sound/error.mp3"></audio>


<script src="script.js"></script>
</body>
</html>
