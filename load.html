<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,600;1,900&display=swap" rel="stylesheet">

<style>
  :root {
    --color-start: #00d2ff;
    --color-end: #3a7bd5;
    --accent-glow: rgba(0, 210, 255, 0.6);
    --dark-bg: #08080c;
  }

  body {
    background-color: var(--dark-bg);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }

  .loader-hub {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .orb-container {
    position: relative;
    width: 150px;
    height: 150px;
    margin-bottom: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .orb {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--color-start), var(--color-end));
    border-radius: 50%;
    filter: blur(1px);
    box-shadow: 0 0 20px var(--color-start), 
                0 0 60px var(--color-end),
                0 0 90px rgba(58, 123, 213, 0.4);
    animation: orbBreathe 2.5s ease-in-out infinite;
  }

  .orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140px;
    height: 140px;
    transform: translate(-50%, -50%);
    animation: orbitRotate 8s linear infinite;
  }

  .orbit-dot {
    position: absolute;
    width: 12px;
    height: 12px;
    background-color: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white, 0 0 20px var(--color-start);
    opacity: 0.8;
  }

  /* Top */
  .orbit-dot.controller { 
    top: 0; 
    left: 50%; 
    transform: translateX(-50%); 
    width: 20px; 
    height: 10px; 
    border-radius: 5px;
  }

  /* Bottom */
  .orbit-dot.star { 
    bottom: 0; 
    left: 50%; 
    transform: translateX(-50%); 
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }

  /* Left */
  .orbit-dot.bolt { 
    left: 0; 
    top: 50%; 
    transform: translateY(-50%);
    clip-path: polygon(40% 0%, 100% 0%, 60% 50%, 90% 50%, 30% 100%, 50% 60%, 10% 60%);
  }

  /* NEW RIGHT DOT 🔥 */
  .orbit-dot.circle-right {
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 10px white, 0 0 20px var(--color-start);
  }

  .wave-text {
    font-size: 28px;
    font-weight: 900;
    font-style: italic;
    color: white;
    text-transform: uppercase;
    letter-spacing: 6px;
    display: flex;
    text-shadow: 0 0 10px var(--color-start);
  }

  .wave-text span {
    display: inline-block;
    animation: textWave 1.5s ease-in-out infinite;
    animation-delay: calc(0.1s * var(--i));
  }

  .progress-container {
    margin-top: 15px;
    width: 200px;
    text-align: center;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, var(--color-start), var(--color-end));
    box-shadow: 0 0 10px var(--color-start);
    animation: progressFill 1s ease-in-out infinite;
  }

  .sub-text {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes orbBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes orbitRotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  @keyframes textWave {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); color: var(--color-start); }
  }

  @keyframes progressFill {
    0% { width: 0%; }
    50% { width: 70%; }
    100% { width: 100%; }
  }

</style>
</head>
<body>

<div class="loader-hub">
  
  <div class="orb-container">
    <div class="orb"></div>
    <div class="orbit">
      <div class="orbit-dot controller"></div>
      <div class="orbit-dot star"></div>
      <div class="orbit-dot bolt"></div>
      <div class="orbit-dot circle-right"></div> <!-- NEW -->
    </div>
  </div>

  <div class="wave-text">
    <span style="--i:1">L</span>
    <span style="--i:2">O</span>
    <span style="--i:3">A</span>
    <span style="--i:4">D</span>
    <span style="--i:5">I</span>
    <span style="--i:6">N</span>
    <span style="--i:7">G</span>
    <span style="--i:8">.</span>
    <span style="--i:9">.</span>
    <span style="--i:10">.</span>
  </div>

  <div class="progress-container">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="sub-text">PREPARING YOUR GAME</div>
  </div>
</div>

</body>
</html>
